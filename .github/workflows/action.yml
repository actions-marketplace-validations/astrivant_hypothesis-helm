name: GitHub Action
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sharded-chart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: hypothesis
        with:
          chart: examples/workload
          max-examples: '5'
          job-index: ${{ strategy.job-index }}
          job-total: ${{ strategy.job-total }}
      - name: Check shard outputs
        shell: bash
        env:
          REPORT: ${{ steps.hypothesis.outputs.junit-path }}
          MANIFESTS: ${{ steps.hypothesis.outputs.manifest-path }}
        run: |
          test -f "$REPORT"
          test -f "$MANIFESTS"
