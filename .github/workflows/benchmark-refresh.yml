name: Benchmark and report refresh

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Verify benchmark automation
    uses: ./.github/workflows/benchmark-smoke.yml
  refresh-prepare:
    name: Prepare shared inputs
    needs: smoke
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 60
    outputs:
      root: ${{ steps.prepare.outputs.root }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-project
      - name: Cache pinned sources and native builds
        uses: actions/cache@v5
        with:
          path: |
            schemas/
            .cache/compiler-builtins/
            .cache/random-renderer/
          key: refresh-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm_catalog/data/*.json', 'pkg/hypothesis_helm_catalog/builder.py', 'pkg/hypothesis_helm_catalog/sources.py', 'pkg/hypothesis_helm_catalog/upstream/*', 'pkg/hypothesis_helm/compiler/assets/renderer/*') }}
      - name: Check project and prepare shared inputs
        id: prepare
        run: poetry run hypothesis-helm-refresh --ci-phase prepare
      - name: Package prepared workspace
        env:
          ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          tar -czf "$RUNNER_TEMP/refresh-prepared.tar.gz" "$ROOT" \
              pkg/hypothesis_helm/compiler/assets/builtin_inventory.json \
              pkg/hypothesis_helm_catalog/data/input-domains.json \
              README.md docs/cli/README.md docs/rules/README.md \
              docs/input-domains/README.md docs/compiler/functions.md
      - uses: actions/upload-artifact@v7
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-prepared.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: refresh-prepare-diagnostics
          path: .cache/refresh/
          include-hidden-files: true
          retention-days: 30
  refresh-study:
    name: "Study: ${{ matrix.study }}"
    needs: refresh-prepare
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # No max-parallel cap: GitHub schedules as many jobs as capacity permits.
      matrix: ${{ fromJSON(needs.refresh-prepare.outputs.matrix) }}
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
      STUDY: ${{ matrix.study }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - name: Restore common source snapshot and inputs
        run: tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
      - name: Run isolated study
        run: poetry run hypothesis-helm-refresh --ci-phase study --root "$ROOT" --study "$STUDY"
      - name: Package study outputs and journal
        if: ${{ always() }}
        run: |
          mkdir -p "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
          tar -czf "$RUNNER_TEMP/refresh-study-$STUDY.tar.gz" \
              "$ROOT/outputs/$STUDY" "$ROOT/statuses" "$ROOT/ci-jobs/$STUDY" "$ROOT/logs"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-study-${{ matrix.study }}
          path: ${{ runner.temp }}/refresh-study-${{ matrix.study }}.tar.gz
          retention-days: 30
  refresh-finish:
    name: Verify plots and scan chart repositories
    needs: [refresh-prepare, refresh-study]
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 360
    env:
      ROOT: ${{ needs.refresh-prepare.outputs.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-project
      - name: Restore pinned chart repositories
        run: git submodule update --init --recursive
      - uses: actions/download-artifact@v8
        with:
          name: refresh-prepared
          path: ${{ runner.temp }}/refresh-input
      - uses: actions/download-artifact@v8
        with:
          pattern: refresh-study-*
          merge-multiple: true
          path: ${{ runner.temp }}/refresh-studies
      - name: Restore all completed study artifacts
        run: |
          tar -xzf "$RUNNER_TEMP/refresh-input/refresh-prepared.tar.gz"
          for archive in "$RUNNER_TEMP"/refresh-studies/*.tar.gz; do
              tar -xzf "$archive"
          done
      - name: Verify measurements, publish diagrams, then test chart repositories
        run: poetry run hypothesis-helm-refresh --ci-phase finish --root "$ROOT"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-refresh
          path: |
            pkg/hypothesis_helm/compiler/assets/builtin_inventory.json
            pkg/hypothesis_helm_catalog/data/input-domains.json
            pkg/hypothesis_helm_benchmarking/assets/fixture/parameters/
            README.md
            docs/cli/README.md
            docs/rules/README.md
            docs/input-domains/README.md
            docs/compiler/functions.md
            docs/benchmarking/
            docs/reports/
            studies/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: refresh-resume-data
          path: ${{ env.ROOT }}
          include-hidden-files: true
          retention-days: 30
