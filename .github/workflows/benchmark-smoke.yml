name: Benchmark smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Check benchmark recipes and plot generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.binary-cache }}
      - name: Exercise benchmark recipes and plots
        run: bash scripts/project-run.sh hypothesis-helm-benchmark smoke
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmark-smoke
          path: .cache/benchmarks/smoke/
          include-hidden-files: true
          retention-days: 30
