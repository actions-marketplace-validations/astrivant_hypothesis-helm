name: Chart tests and security
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      kubesec-score-minimum:
        description: Minimum Kubesec score (defaults to HH_KUBESEC_SCORE_MINIMUM or 0)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      kubesec-score-minimum:
        description: Minimum Kubesec score (defaults to HH_KUBESEC_SCORE_MINIMUM or 0)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  sharded-chart:
    name: "Chart tests and Kubesec (Kubernetes ${{ matrix.kubernetes }}, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        kubernetes: ['1.34.0', '1.35.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Restore chart outcomes and manifests
        id: outcomes
        uses: actions/cache/restore@v5
        with:
          path: .cache/hypothesis-helm/outcomes
          key: chart-outcomes-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.kubernetes }}-${{ matrix.shard }}-of-3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chart-outcomes-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.kubernetes }}-${{ matrix.shard }}-of-3-
      - uses: ./
        id: hypothesis
        with:
          chart: examples/workload
          incremental: 'true'
          cache-dir: .cache/hypothesis-helm/outcomes
          rerun: ${{ startsWith(github.ref, 'refs/tags/') && 'all' || 'auto' }}
          max-examples: '5'
          schema-validation: 'true'
          schema-version: ${{ matrix.kubernetes }}
          kubesec: 'true'
          kubesec-jobs: auto
          kubesec-score-minimum: ${{ inputs.kubesec-score-minimum || vars.HH_KUBESEC_SCORE_MINIMUM || '0' }}
          artifact-name: hypothesis-helm-${{ matrix.kubernetes }}
          schema-cache-dir: schemas
          job-index: ${{ matrix.shard }}
          job-total: '3'
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kubernetes }}
      - name: Save chart outcomes and manifests
        if: ${{ always() && steps.outcomes.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/hypothesis-helm/outcomes
          key: ${{ steps.outcomes.outputs.cache-primary-key }}
      - name: Check shard outputs
        shell: bash
        env:
          REPORT: ${{ steps.hypothesis.outputs.junit-path }}
          MANIFESTS: ${{ steps.hypothesis.outputs.manifest-path }}
        run: |
          test -f "$REPORT"
          test -f "$MANIFESTS"
  aggregate:
    name: "Combine shard reports (Kubernetes ${{ matrix.kubernetes }})"
    needs: sharded-chart
    if: ${{ always() && needs.sharded-chart.result != 'skipped' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ['1.34.0', '1.35.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - uses: actions/download-artifact@v8
        with:
          pattern: hypothesis-helm-${{ matrix.kubernetes }}-sharded-chart-*
          path: downloaded
      - uses: actions/download-artifact@v8
        if: ${{ always() }}
        with:
          pattern: hypothesis-helm-${{ matrix.kubernetes }}-kubesec-sharded-chart-*
          path: downloaded-security
      - name: Write final report for this Kubernetes version
        if: ${{ always() }}
        env:
          HH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kubernetes }}
          HH_KUBESEC: 'true'
          HH_SCHEMA_VERSION: ${{ matrix.kubernetes }}
          HH_KUBESEC_SCORE_MINIMUM: ${{ inputs.kubesec-score-minimum || vars.HH_KUBESEC_SCORE_MINIMUM || '0' }}
        run: |
          aggregate_status=0
          cat downloaded/*/report.json | hypothesis-helm aggregate \
              --shards 3 --run-id "$HH_RUN_ID" --output-dir docs/reports/final || aggregate_status=$?
          if [[ "${HH_KUBESEC:-false}" == "true" ]]; then
              security_status=0
              hypothesis-helm-kubesec downloaded-security --aggregate --shards 3 \
                  --run-id "$HH_RUN_ID" --schema-version "$HH_SCHEMA_VERSION" \
                  --score-minimum "$HH_KUBESEC_SCORE_MINIMUM" \
                  --output docs/reports/final/kubesec || security_status=$?
              if ((aggregate_status == 0)); then
                  aggregate_status=$security_status
              fi
          fi
          exit "$aggregate_status"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: hypothesis-helm-final-${{ matrix.kubernetes }}
          path: docs/reports/final/
          if-no-files-found: error
          retention-days: 30
