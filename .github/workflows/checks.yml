name: Code checks and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      binary-cache:
        description: Cache the versioned Helm binary
        type: boolean
        default: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint, Go tests and parallel Python tests
    runs-on: ${{ vars.HH_CI_RUNNER || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 30
    steps:
      - name: Check out source and Git LFS data
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up project tools
        uses: ./.github/actions/setup-project
        with:
          binary-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.binary-cache }}
      - name: Check the Kubernetes and compiler source extractors
        run: go -C pkg/hypothesis_helm_catalog/upstream test ./...
      - name: Cache the pinned random-input renderer
        uses: actions/cache@v5
        with:
          path: .cache/random-renderer/
          key: hh-random-renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pkg/hypothesis_helm/compiler/assets/renderer/*') }}
      - name: Build the random-input renderer for native integration tests
        run: bash scripts/project-run.sh hypothesis-helm-renderer --build
      - name: Run every pre-commit hook
        run: bash scripts/project-run.sh pre-commit run --all-files --show-diff-on-failure
      - name: Run framework checks and parallel tests
        run: bash scripts/check.sh --junitxml=.cache/tests/pytest.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: .cache/tests/
          include-hidden-files: true
          retention-days: 30
