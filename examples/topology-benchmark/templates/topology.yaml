{{ if .Values.input002 }}
apiVersion: v1
kind: Service
metadata:
  name: topology-service
spec:
  selector:
    app: topology
  ports:
    - port: {{ if .Values.input004 }}8080{{ else }}80{{ end }}
      targetPort: {{ if .Values.input004 }}8080{{ else }}80{{ end }}
{{ if .Values.input003 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: topology-ingress
spec:
  defaultBackend:
    service:
      name: topology-service
      port:
        number: {{ if .Values.input004 }}8080{{ else }}80{{ end }}
{{ end }}
{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-workload
spec:
  replicas: {{ if .Values.input005 }}3{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: topology
  template:
    metadata:
      labels:
        app: topology
    spec:
      containers:
        - name: app
          image: nginx:1.27
{{ if .Values.input002 }}
{{ if .Values.input003 }}{{ if .Values.input006 }}{{ if .Values.input007 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: topology-rare
data:
  signal: rare
{{ end }}{{ end }}{{ end }}{{ end }}
