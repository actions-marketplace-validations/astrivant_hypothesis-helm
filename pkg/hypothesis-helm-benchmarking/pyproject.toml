[tool.poetry]
name = "hypothesis-helm-benchmarking"
version = "0.1.0"
description = "Reproducible Helm chart studies, performance plots, and repository refreshes"
authors = ["Emma Doyle"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/astrivant/hypothesis-helm"
packages = [{include = "hypothesis_helm_benchmarking"}]
exclude = ["dist", "__pycache__", "poetry.lock"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
hypothesis-helm = ">=0.1.0,<0.2.0"
matplotlib = ">=3.10,<4"
numpy = ">=2,<3"
pysr = {version = ">=1.5,<2", optional = true}

[tool.poetry.extras]
symbolic = ["pysr"]

[tool.poetry.scripts]
hypothesis-helm-benchmark = "hypothesis_helm_benchmarking.cli:main"
hypothesis-helm-refresh = "hypothesis_helm_benchmarking.refresh.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
